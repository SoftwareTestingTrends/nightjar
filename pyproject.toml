[project]
name = "nightjar"
version = "0.1.0"
description = "NightJar: a sleep diary with a bedtime nudge and an AI sleep coach (course demo app)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1,<2",
    "fastapi>=0.115",
    "httpx>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "playwright>=1.45",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nightjar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: browser tests (need `uv run playwright install chromium`)"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DTZ"]
